name: Rust CI
permissions:
  contents: read

on:
  push:
    #branches:
    #  - main
  pull_request:
    #branches:
    #  - main

jobs:
  build:
    strategy:
      matrix:
        feature_async_trait: [true, false]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          override-with: rustup

      - name: Build
        run: cargo build --locked --workspace --verbose ${{ matrix.feature_async_trait && '--features async-trait' || '' }}

      - name: Run tests
        run: cargo test --locked --workspace --verbose ${{ matrix.feature_async_trait && '--features async-trait' || '' }}

      - name: Check ewebsock transport with cluster support (native)
        run: cargo check --locked -p ractor_wormhole --features websocket_client_wasm,ractor_cluster ${{ matrix.feature_async_trait && '--features async-trait' || '' }}

      - name: Test transport lifecycle and cluster support
        run: cargo test --locked -p ractor_wormhole --lib --features websocket_client_wasm,websocket_server,unix_socket_client,unix_socket_server,ssh_client,russh_ring,ractor_cluster,serde,bincode ${{ matrix.feature_async_trait && '--features async-trait' || '' }}

      - name: Test sample transport selection
        run: cargo test --locked -p ractor_wormhole_sample_app --features ssh,unix_socket ${{ matrix.feature_async_trait && '--features async-trait' || '' }}

  check_wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          override-with: rustup

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check WASM default
        working-directory: ./chat_app/wasm_client
        run: cargo check --locked -p wasm_client --target wasm32-unknown-unknown

      - name: Check WASM async-trait
        working-directory: ./chat_app/wasm_client
        run: cargo check --locked -p wasm_client --target wasm32-unknown-unknown --features async-trait

      # ractor_cluster is not checked for wasm: ractor's `cluster` feature does
      # not currently compile for wasm32-unknown-unknown.
      - name: Check browser transport
        run: cargo check --locked -p ractor_wormhole --target wasm32-unknown-unknown --features websocket_client_wasm

      - name: Check browser transport with async-trait
        run: cargo check --locked -p ractor_wormhole --target wasm32-unknown-unknown --features websocket_client_wasm,async-trait

  deploy_wasmer_edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, check_wasm]
    runs-on: ubuntu-latest
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          override-with: rustup

      - name: Install Rust 1.90 Cargo
        run: rustup toolchain install 1.90.0-x86_64-unknown-linux-gnu

      - name: Install native linker tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install --locked trunk

      - name: Install Wasmer
        run: |
          curl https://get.wasmer.io -sSfL | sh -s v7.2.0
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Install Edge-compatible WASIX toolchain
        working-directory: ./chat_app/wasmer_server
        run: |
          cargo install cargo-wasix --version 0.1.31 --root .cargo-wasix-0.1.31
          ./.cargo-wasix-0.1.31/bin/cargo-wasix wasix download-toolchain 'v2026-06-09.1+rust-1.90'

      - name: Build Wasmer Edge package
        working-directory: ./chat_app/wasmer_server
        run: ./scripts/build-edge-wasm.sh

      - name: Deploy Wasmer Edge package
        working-directory: ./chat_app/wasmer_server
        run: wasmer deploy --owner 0x53a --publish-package --non-interactive
