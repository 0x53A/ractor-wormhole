[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
ractor_wormhole = { path = "../../ractor_wormhole", features = ["websocket_server"] }
shared = { path = "../shared" }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
ractor = { version = "0.16", features = [] }
# Keep at 1.52 or lower: chat_app/wasmer_server patches in the wasix tokio fork, labelled 1.52.3.
tokio = { version = "1.52", features = ["macros", "net", "rt"] }
anyhow = { version = "1.0", features = ["backtrace"] }
rand = "0.10"
static_assertions = "1.1"
futures = "0.3"
futures-util = "0.3"
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-tungstenite = "0.30"
http-body-util = "0.1"

[features]
async-trait = ["ractor_wormhole/async-trait"]
